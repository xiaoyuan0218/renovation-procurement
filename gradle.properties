# 仓库根的 Gradle 构建壳在 settings.gradle.kts 里把 :app 指向 mobile/app，
# 但 Gradle 只读「构建根」的 gradle.properties —— AndroidX 开关不跟着 projectDir
# 走，缺了它 :app 一配置就报 "android.useAndroidX=true is required"。与
# mobile/gradle.properties 保持同一份内容。
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
