name: 打包 APK（下载直链）

# 构建两个安卓 App，把 APK 发布到一个滚动更新的 release 上。
# 直链形如 .../releases/latest/download/caizhidao-online.apk，只要这个工作流
# 在跑，它就永远指向最新构建 —— 手机点开即下，不用登录、不用找 artifact。
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

# 两次 push 挨得近时只保留最新一次构建，避免两个任务同时改同一个 release
concurrency:
  group: apk-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: 网络版（连服务器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建 debug + release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  mobile:
    name: 单机版（数据在手机）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 跑单测 + 构建 debug + release
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: |
            mobile/app/build/outputs/apk/debug/app-debug.apk
            mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish:
    name: 更新下载直链
    needs: [android, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apks/android
      - uses: actions/download-artifact@v4
        with:
          name: mobile-apk
          path: apks/mobile

      # 资产名固定，直链才不会随构建变；改这里的名字 = 改直链，两处要一起来
      - name: 改成固定的资产名
        run: |
          mkdir -p out
          cp apks/android/app-release.apk out/caizhidao-online.apk
          cp apks/android/app-debug.apk   out/caizhidao-online-debug.apk
          cp apks/mobile/app-release.apk  out/caizhidao-offline.apk
          cp apks/mobile/app-debug.apk    out/caizhidao-offline-debug.apk
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          make_latest: true
          body: |
            手机点链接直接下载安装，不用登录：

            **网络版**（连服务器，数据存在服务器上）
            - [caizhidao-online.apk](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/caizhidao-online.apk)
            - [caizhidao-online-debug.apk（调试包）](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/caizhidao-online-debug.apk)

            **单机版**（数据存在手机本地，可选连服务器）
            - [caizhidao-offline.apk](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/caizhidao-offline.apk)
            - [caizhidao-offline-debug.apk（调试包）](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/caizhidao-offline-debug.apk)

            带 `-debug` 的包名多一个 `.debug` 后缀，与正式版可以并存、互不覆盖；
            拿不准装哪个就用不带 debug 的。这个页面每次 push 自动更新，链接不变。
          files: out/*.apk
