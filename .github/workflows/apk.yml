name: 打包 APK（下载直链）

# 构建两个安卓 App，把 APK 发布到一个滚动更新的 release 上。
# 直链形如 .../releases/latest/download/caizhidao-online.apk，只要这个工作流
# 在跑，它就永远指向最新构建 —— 手机点开即下，不用登录、不用找 artifact。
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

# 两次 push 挨得近时只保留最新一次构建，避免两个任务同时改同一个 release
concurrency:
  group: apk-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: 网络版（连服务器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建 debug + release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  mobile:
    name: 单机版（数据在手机）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 跑单测 + 构建 debug + release
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: |
            mobile/app/build/outputs/apk/debug/app-debug.apk
            mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish:
    name: 更新下载直链
    needs: [android, mobile]
    runs-on: ubuntu-latest
    steps:
      # gh release 要读 git 上下文（拿当前 commit 当 tag 的目标），没 checkout 会报
      # "failed to run git: not a git repository"
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apks/android
      - uses: actions/download-artifact@v4
        with:
          name: mobile-apk
          path: apks/mobile

      # 资产名固定，直链才不会随构建变；改这里的名字 = 改直链，两处要一起来。
      # artifact 内部的目录结构由 upload-artifact 决定（会剥掉公共前缀），用 find 定位最稳。
      - name: 改成固定的资产名
        run: |
          mkdir -p out
          cp "$(find apks/android -name app-release.apk -print -quit)" out/caizhidao-online.apk
          cp "$(find apks/android -name app-debug.apk   -print -quit)" out/caizhidao-online-debug.apk
          cp "$(find apks/mobile  -name app-release.apk -print -quit)" out/caizhidao-offline.apk
          cp "$(find apks/mobile  -name app-debug.apk   -print -quit)" out/caizhidao-offline-debug.apk
          ls -la out

      # 发布用 gh CLI，不用 softprops/action-gh-release：后者在当前 Node 24 的
      # runner 上会在发布环节抛 TypeError: Invalid URL，release 停在 draft ——
      # 资产传上去了但直链要登录才能下。每次删掉重建，latest 永远指向最新构建。
      - name: 发布到固定链接
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          手机点链接直接下载安装，不用登录：

          **网络版**（连服务器，数据存在服务器上）
          - [caizhidao-online.apk](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/caizhidao-online.apk)
          - [caizhidao-online-debug.apk（调试包）](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/caizhidao-online-debug.apk)

          **单机版**（数据存在手机本地，可选连服务器）
          - [caizhidao-offline.apk](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/caizhidao-offline.apk)
          - [caizhidao-offline-debug.apk（调试包）](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/caizhidao-offline-debug.apk)

          带 `-debug` 的包名多一个 `.debug` 后缀，与正式版可以并存、互不覆盖；
          拿不准装哪个就用不带 debug 的。这个页面每次 push 自动更新，链接不变。
          EOF

          # 清掉旧的（连残留的 draft 一起）：gh release delete 看不到 draft，走 API 更彻底
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "latest") | .id' |
            while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id"; done
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" 2>/dev/null || true

          gh release create latest --title "最新构建" --notes-file /tmp/notes.md
          gh release upload latest out/*.apk
          gh release view latest --json tagName,isDraft,assets \
            --jq '"发布完成: " + .tagName + " draft=" + (.isDraft|tostring) + " 资产=" + ([.assets[].name]|join(", "))'
