name: 桌面端

# 桌面端安装包：Windows 上真机构建（Tauri 要 MSVC，交叉编译不划算）。
# 产物固定文件名挂到 latest release，跟 APK 一样给出直链。
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      # Rust 构建缓存：不缓存的话每次都要从头编 Tauri 那一堆依赖
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 打包内置后端（sidecar exe）
        run: python backend/packaging/build_server.py

      - name: 安装桌面端依赖
        run: npm install

      - name: 构建 NSIS 安装包
        run: npx tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "src-tauri\target\release\bundle\nsis\*setup.exe" "out\caizhidao-desktop-setup.exe"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: caizhidao-desktop
          path: out/*.exe

      - name: 发布到 latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload latest out/*.exe --clobber
