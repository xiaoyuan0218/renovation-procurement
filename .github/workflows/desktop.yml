name: 桌面端

# 桌面端安装包：Windows 上真机构建（Tauri 要 MSVC，交叉编译不划算）。
# 产物固定文件名挂到 latest release，跟 APK 一样给出直链。
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

# gh release upload 要写权限，缺了这行 token 只有只读，发布那步会 403
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # 英文版 runner 的默认编码是 cp1252，任何打印中文的 Python 步骤都会崩
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      # Rust 构建缓存：不缓存的话每次都要从头编 Tauri 那一堆依赖
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 打包失败时把日志尾部挂成 annotation。CI 的完整日志要登录才看得到，
      # 这步在 runner 上挂过一次、本地却怎么都复现不出来，当时一点线索都没有。
      - name: 打包内置后端（sidecar exe）
        run: |
          Write-Output "python: $(python --version 2>&1)"
          Write-Output "pyinstaller: $(python -m PyInstaller --version 2>&1)"
          $out = python backend/packaging/build_server.py 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            $tail = ($out | Select-Object -Last 40) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=sidecar 打包失败::$tail"
            exit 1
          }

      - name: 安装桌面端依赖
        run: npm install

      - name: 构建 NSIS 安装包
        run: npx tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "src-tauri\target\release\bundle\nsis\*setup.exe" "out\caizhidao-desktop-setup.exe"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: caizhidao-desktop
          path: out/*.exe

      - name: 发布到 latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # release 平时由 apk.yml 建；手动触发时可能还没有，补一个
          gh release view latest 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --title "最新构建" --notes "手机与桌面端的下载直链"
          }
          # 文件名写死，不要写成 out/*.exe：pwsh 不会替原生命令展开通配符，
          # gh 收到的是字面量，会报找不到文件（bash 才会展开）。名字与上一步对齐。
          $out = gh release upload latest out/caizhidao-desktop-setup.exe --clobber 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            $tail = ($out | Select-Object -Last 20) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=发布失败::$tail"
            exit 1
          }
