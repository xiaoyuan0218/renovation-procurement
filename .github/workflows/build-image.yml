name: build-image

# 只在 main 分支推送与手动触发时构建，避免 PR 里跑无用构建
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**.md"
      - "docker-compose.yml"
      - ".gitignore"
      - ".gitattributes"
      - "screenshots/**"
      - "screenshots-android/**"
      - "seed/**"
      # 安卓客户端是独立产物，改动它不该重建后端镜像（它有自己的 android.yml）
      - "android/**"
      - "dist/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR 要求镜像名全小写，仓库名含大写时需转换
      - name: 计算镜像名
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      # 构建时间戳给「检查更新」用：网页拿它跟 GitHub 上最新构建的时间比，
      # 判断这台服务器该不该 docker compose pull
      - name: 记下构建时间
        id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 版本号统一在仓库根的 VERSION 文件里，安卓端也读它，三端一致
      - name: 读版本号
        id: ver
        run: echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            RENOVATION_VERSION=${{ steps.ver.outputs.v }}
            RENOVATION_BUILT_AT=${{ steps.stamp.outputs.at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
